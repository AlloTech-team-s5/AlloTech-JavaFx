# =====================================================================
#  AlloTech : modele de configuration
#
#  1. Copier ce fichier en "config.properties" (meme dossier, a la racine du projet)
#  2. Remplacer VOTRE_MOT_DE_PASSE par votre mot de passe MySQL
#
#  config.properties est dans .gitignore : il ne part JAMAIS sur GitHub.
#  Seul P1 modifie ce fichier modele. Pour ajouter un parametre, demander a P1.
# =====================================================================

# ---------- Base de donnees MySQL ----------
db.url=jdbc:mysql://localhost:3306/allotech?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Africa/Casablanca
db.user=root
db.password=VOTRE_MOT_DE_PASSE

# ---------- Regles des demandes (RG6, RG7) ----------
# N : nombre maximal de demandes par jour pour un meme probleme
demande.limite.par.probleme.par.jour=3
# D : delai (en heures) avant qu'une demande EN_ATTENTE passe a EXPIREE
demande.expiration.heures=48

# ---------- Dossier technicien (RG3, RG18) ----------
# Nombre maximal de soumissions d'un dossier (refus pour modification)
technicien.soumissions.max=3

# ---------- Abonnement (RG4) ----------
# Duree de l'essai gratuit, en jours (1 mois)
abonnement.essai.jours=30

# ---------- Notifications (RF39) ----------
# Intervalle de verification des nouvelles notifications, en secondes
notification.intervalle.secondes=5

# ---------- Fichiers deposes (photos, CV, CIN) ----------
# Dossier local ou sont copies les fichiers choisis par les utilisateurs
stockage.dossier=uploads
